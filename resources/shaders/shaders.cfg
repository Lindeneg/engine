# Shader programs. The editor writes this file; the engine only reads it.
#
#   vert / frag   files under assets/shaders. They may #include each other.
#   features      which of the engine's feature defines this program is built
#                 with. Every combination is compiled up front, so a shader
#                 costs 2^(number of features) programs -- list only what the
#                 shader actually branches on.
#
# The engine publishes the feature list (shader::feature_name), so an editor
# offers these as a checklist rather than free text. Today: SKINNED, ALPHA_MASK.
#
# A name here that no file backs, or a feature the engine does not know, is a
# hard startup failure -- a shader that will not build is a broken deployment.

# Roles: the shaders the engine reaches for itself, without a material in
# between. Each must name a shader declared below.
#
#   default_shader   what a material gets when nothing has assigned it one
#   debug_shader     position and colour only, for the lines drawn over the
#                    scene by gfx/debugdraw
#   canvas_shader    textured quads in pixel space, for gfx/canvas: text, the
#                    HUD, the editor's panels
default_shader mesh
debug_shader debug
canvas_shader canvas

shader "mesh" {
    vert     mesh.vert
    frag     mesh.frag
    features SKINNED ALPHA_MASK
}

shader "debug" {
    vert debug.vert
    frag debug.frag
}

shader "canvas" {
    vert canvas.vert
    frag canvas.frag
}
