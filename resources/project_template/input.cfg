# This project's maps, added to the engine's when the project opens. The
# editor switches the map named by play_map in editor.cfg off while editing.
# Action names must not repeat any the engine's maps declare.

map "gameplay" {
    move_forward w up
    move_back    s down
    move_left    a left
    move_right   d right

    jump         space
    crouch       left_control
    sprint       left_shift

    fire         mouse_left
    aim          mouse_right
    reload       r
    interact     e
}
