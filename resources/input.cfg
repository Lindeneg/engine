# The engine's own maps: what works whatever project is open. A project's
# input.cfg adds the game's maps to these when it is opened.
#
# A map is a group of actions that switches on and off as a unit. An action is
# a name followed by the keys or buttons that produce it; several bindings are
# an OR. Keys use their plain spelling ("w", "space", "left_shift"), mouse
# buttons carry a prefix ("mouse_left"). A chord is modifiers joined to the key
# with '+': control, shift and alt, either side. A plain key fires whatever
# else is held. Action names are unique across every map, the project's too.

# Always on, including while the game is suspended behind the editor.
map "system" {
    quit              escape
    toggle_mouse_look grave_accent
    toggle_debug_draw f3
    toggle_editor     f1
    reload_scripts    f5
}

# On only while editing; the editor switches it with the project's play map.
map "editor" {
    editor_look     mouse_right
    editor_select   mouse_left

    # while editor_look is held
    editor_forward  w
    editor_back     s
    editor_left     a
    editor_right    d
    editor_up       e
    editor_down     q
    editor_fast     left_shift

    focus_selection f
    delete_entity   delete
    undo            control+z
    redo            control+y
    save_level      control+s

    # the gizmo: world or the entity's own axes, and grid snapping while held
    toggle_gizmo_space t
    gizmo_snap         left_control
}
