# Input. Every action there is, and what produces it. The engine reads this file
# and the editor writes it; nothing in C++ knows the names below.
#
# A map is a group of actions that switches on and off as a unit. That is what
# keeps the editor out of the game's way: with "gameplay" disabled, WASD stops
# driving the player and no gameplay code has to learn that a panel opened.
# Anything that must keep working either way belongs in its own map, which is
# why quit lives in "system" rather than next to the movement keys.
#
# An action is a name followed by the keys or buttons that produce it. Several
# bindings are an OR -- "move_forward w up" means either one. Keys use their
# plain spelling ("w", "space", "left_shift", "grave_accent"); mouse buttons
# carry a prefix ("mouse_left"), so one token never means two things. The engine
# publishes both name lists, so an editor offers them as a picker rather than as
# free text, and a name it does not know is skipped with a warning.
#
# Action names are unique across maps: code asks for "jump", not "gameplay/jump".

map "gameplay" {
    move_forward w up
    move_back    s down
    move_left    a left
    move_right   d right

    jump         space
    crouch       left_control
    sprint       left_shift

    fire         mouse_left
    aim          mouse_right
    reload       r
    interact     e
}

# Always on, including while the game is suspended behind an editor panel.
map "system" {
    quit              escape
    toggle_mouse_look grave_accent
}

# The editor's own map goes here when there is an editor: an "editor" block
# holding focus_selection, toggle_grid and the rest, enabled when a panel takes
# focus and disabled again when it gives it back. Nothing is listed yet because
# nothing reads those actions -- an action no code consumes is dead weight, not
# a placeholder.
