# The editor: how the free camera handles and what it draws. Read once at
# startup. The panels' look is ui.cfg; the keys are the "editor" map of
# input.cfg.

# the game's map, switched off while editing so the player stops taking WASD
play_map gameplay

camera {
    speed 5.0        # metres per second
    fast_scale 4.0   # while editor_fast is held
    sensitivity 0.15 # degrees per pixel while editor_look is held
    fov 70
    near 0.05
    far 500

    # where a session starts
    position 0 2 6
    yaw 0
    pitch -10
}

panels {
    hierarchy_width 260
    inspector_width 320
}

selection_color 1.0 0.5 0.1

# the axes drawn for an entity with nothing to see -- a camera, a light -- in
# metres, and the radius a click picks it by
marker_size 0.3

# how far a selected camera's frustum is drawn; its far plane would fill the level
frustum_depth 10

# edits remembered for undo; a drag or a run of typing is one
undo_depth 256
