# Engine startup. Every knob a person would change without a rebuild lives
# here; the C++ side keeps only a default for a key that is missing.

log_level trace
level test

# arena sizes, in MiB
memory {
    perm 64
    scratch 64
}

window {
    width 1280
    height 720
    title explore
    vsync true
}

render {
    max_draw_items 4096
    max_objects 512
    max_skinned_draws 32
    clear_color 0.10 0.11 0.13
}

# Lines drawn over the scene for looking at what the simulation did. The
# capacities count line segments: a box is 12, a sphere 3 * sphere_segments.
debug_draw {
    max_lines 8192
    max_retained 4096
    sphere_segments 24

    axis_x_color 1.0 0.2 0.2
    axis_y_color 0.2 1.0 0.2
    axis_z_color 0.2 0.4 1.0

    # Read by main, not the engine: what toggle_debug_draw shows for every
    # visible renderable. The player's own colour sits in its block below.
    bounds_color 1.0 0.85 0.1
}

# The 2D layer: text, the HUD, the editor's panels. Capacities are per frame.
canvas {
    max_quads 16384
    max_batches 256
    max_clip_depth 16
}

# The UI font, baked once at startup. The range is codepoints; 32 for 95 is
# printable ASCII. A range that does not fit the atlas is a startup failure.
font {
    file fonts/arial.ttf
    size 16
    atlas 512
    oversample 2
    first 32
    count 95
}

# Read by main: the readout toggle_debug_draw puts in the corner.
overlay {
    padding 8

    # per-frame blend toward the new frame time, 0..1; smaller is steadier
    smoothing 0.05

    # seconds over which the frame rate and the worst frame are measured
    window 1.0

    text_color 0.92 0.92 0.92
    background_color 0 0 0 0.55
}

# pool capacities, and scope arenas in MiB
assets {
    max_models 64
    max_meshes 256
    max_materials 256
    max_skeletons 32
    max_clips 128
    persistent 128
    transient 128
}

world {
    max_entities 4096
    max_renderables 2048
    max_animators 64
    max_cameras 8
    max_lights 16
    fixed_hz 120
    max_fixed_steps 8
}

# Not the engine's: src/game decides all of this. It sits here because the
# player is not a component yet, so there is nowhere on the entity to put it.
# When a game can declare its own components this block moves onto the entity in
# the level file, where the editor can reach it.
player {
    # the root entity in the level this drives
    body player

    move_speed   4.0
    sprint_scale 1.8

    look_sensitivity 0.12
    look_invert_y    false
    pitch_min        -89
    pitch_max         89

    # the sphere the body is swept as: half a shoulder width
    radius 0.35

    gravity     9.81
    jump_height 1.1

    # Stand-in floor. Nothing in the test level has geometry to stand on yet.
    ground_height 0

    # the swept sphere, drawn under toggle_debug_draw
    debug_color 0.2 1.0 0.4

    # Where the camera sits in the body's yawed frame. This is the entire
    # difference between first and third person: 0 1.65 0 puts you behind the
    # eyes, and the value below puts the camera over the shoulder so the model
    # and its gun stay visible.
    eye_offset 0 1.7 2.5
}
