# Engine startup. Every knob a person would change without a rebuild lives
# here; the C++ side keeps only a default for a key that is missing.

log_level trace
level test

# arena sizes, in MiB
memory {
    perm 64
    scratch 64
}

window {
    width 1280
    height 720
    title explore
    vsync true
}

render {
    max_draw_items 4096
    max_objects 512
    max_skinned_draws 32
    clear_color 0.10 0.11 0.13
}

# pool capacities, and scope arenas in MiB
assets {
    max_models 64
    max_meshes 256
    max_materials 256
    max_skeletons 32
    max_clips 128
    persistent 128
    transient 128
}

world {
    max_entities 4096
    max_renderables 2048
    max_animators 64
    max_cameras 8
    max_lights 16
    fixed_hz 120
    max_fixed_steps 8
}

# The stand-in for a player controller: main.cpp orbits the level's camera
# around the first renderable. Goes away with input.
camera_orbit {
    speed 0.4
    height 0.35
    distance 1.15
}
