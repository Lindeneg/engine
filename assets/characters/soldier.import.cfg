# How to bring soldier.glb into world space. Belongs to the asset, not to
# whoever loads it: two entities referencing this model must not each restate
# the scale.

import {
    # The inverse bind matrices already carry a 14.71x mesh->skeleton scale and
    # the Z-up to Y-up rotation, so skinning does that work and this only trims
    # the result to a 1.8 m height. Measured from bind-pose bounds -- raw
    # vertex bounds are pre-skin and read as 0.143 m tall.
    scale 0.857
    z_up  false
}
