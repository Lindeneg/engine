# This clip was authored for a different rig, so playing it here is retargeting.
# Only its author knows that -- the engine measures and warns, it does not guess.

clip {
    # Rotations only. The translation channels carry the source rig's bone
    # lengths in the source file's units: max translation is 99.25 against this
    # skeleton's 1.22, an 81x mismatch that throws joints off screen.
    #
    # Costs root motion. A locomotion clip would need the root translation
    # transferred and rescaled by the ratio of hip heights.
    rotation_only true
}
