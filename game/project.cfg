# A project: what the engine opens. The dashboard fills in the name; the
# editor's project section edits the rest.

name game
title game

# the level opened first, under levels/
level main

# pool capacities for this project's worlds. A row under pools names a
# component; one a component this project never registers is simply unused, and
# a component with no row here gets pool_default.
world {
    max_entities 4096
    pools {
        renderable 2048
        animator   64
        camera     8
        light      16
        collider   256
    }
    pool_default 256
    fixed_hz 120
    max_fixed_steps 8
}

# Game code's, not the engine's: the player controller reads this until the
# game is a script. It stays in the project because the game owns it.
player {
    body player

    move_speed 4.0
    sprint_scale 1.8

    look_sensitivity 0.12
    look_invert_y false
    pitch_min -89
    pitch_max 89

    radius 0.35

    gravity 9.81
    jump_height 1.1

    # a floor of last resort under any collider
    ground_height -10

    eye_offset 0 1.7 2.5

    debug_color 0.2 1.0 0.4
}
