# The editor: how the free camera handles and what it draws. Read once at
# startup. The panels' look is ui.cfg; the keys are the "editor" map of
# input.cfg.

# the game's map, switched off while editing so the player stops taking WASD
play_map gameplay

camera {
    speed 5.0        # metres per second
    fast_scale 4.0   # while editor_fast is held
    sensitivity 0.15 # degrees per pixel while editor_look is held
    fov 70
    near 0.05
    far 500

    # where a session starts
    position 0 2 6
    yaw 0
    pitch -10
}

panels {
    hierarchy_width 260
    inspector_width 320
    assets_height 300 # the assets panel, under the hierarchy
}

# the project screen shown when the binary starts without a project; padding
# is inside the panel, in place of ui.cfg's, since a dialog wants more air
dashboard {
    width   640
    height  600
    padding 24
}

selection_color 1.0 0.5 0.1

# every collider, drawn whenever the level is being edited
collider_color 0.3 0.9 0.9

# the axes drawn for an entity with nothing to see -- a camera, a light -- in
# metres, and the radius a click picks it by
marker_size 0.3

# how far a selected camera's frustum is drawn; its far plane would fill the level
frustum_depth 10

# Undo: how many edits are remembered (a drag or a run of typing is one), and
# how many bytes an entry holds for a created or deleted subtree as level text.
# A subtree that does not fit cannot be undone, and says so.
undo {
    depth 256
    blob  4096
}

# room for the whole level as text while it plays, so coming back to edit mode
# finds it exactly as it was
snapshot 262144

# The translate gizmo. Pixel sizes hold at any distance; the plane squares are
# fractions of an axis length; snap is metres per step while gizmo_snap is held.
gizmo {
    size 90
    tolerance 8
    plane_size 0.25
    plane_offset 0.25
    snap 0.25
}
