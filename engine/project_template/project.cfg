# A project: what the engine opens. The dashboard fills in the name; the
# editor's project section edits the rest.

name  untitled
title untitled

# the level opened first, under levels/
level main

# the main script: declares components when the project opens, and its hooks
# run beside the entities' while playing
script scripts/main.lua

# pool capacities for this project's worlds. A row under pools names a
# component; one a component this project never registers is simply unused, and
# a component with no row here gets pool_default.
world {
    max_entities 4096
    pools {
        renderable 2048
        animator   64
        camera     8
        light      16
        collider   256
    }
    pool_default 256
    fixed_hz 120
    max_fixed_steps 8
}
