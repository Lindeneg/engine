# Engine startup. Every knob a person would change without a rebuild lives
# here; the C++ side keeps only a default for a key that is missing. Nothing
# about any game: that is the project's project.cfg.

log_level trace

# maps and actions across the engine's input.cfg and a project's together
input {
    max_maps 8
    max_actions 128
}

# projects the dashboard lists, most recent first
recent_projects 8

# arena sizes, in MiB
memory {
    perm 64
    scratch 64
}

window {
    width 1280
    height 720
    title explore
    vsync true
}

render {
    max_draw_items 4096
    max_objects 512
    max_skinned_draws 32
    clear_color 0.10 0.11 0.13
}

# Lines drawn over the scene for looking at what the simulation did. The
# capacities count line segments: a box is 12, a sphere 3 * sphere_segments.
debug_draw {
    max_lines 8192
    max_retained 4096
    sphere_segments 24

    axis_x_color 1.0 0.2 0.2
    axis_y_color 0.2 1.0 0.2
    axis_z_color 0.2 0.4 1.0

    # Read by main, not the engine: what toggle_debug_draw shows for every
    # visible renderable and every collider. The player's own colour sits in
    # its block below.
    bounds_color 1.0 0.85 0.1
    collider_color 0.3 0.9 0.9
}

# The 2D layer: text, the HUD, the editor's panels. Capacities are per frame.
canvas {
    max_quads 16384
    max_batches 256
    max_clip_depth 16
}

# The UI font, baked once at startup. The range is codepoints; 32 for 95 is
# printable ASCII. A range that does not fit the atlas is a startup failure.
font {
    file fonts/arial.ttf
    size 16
    atlas 512
    oversample 2
    first 32
    count 95
}

# Widget bookkeeping; the look is assets/ui.cfg.
ui {
    max_retained 1024
    max_id_depth 32
}

# Read by main: the debug panel toggle_debug_draw opens, usable once the
# cursor is loose (toggle_mouse_look).
overlay {
    padding 8
    panel 340 330

    # per-frame blend toward the new frame time, 0..1; smaller is steadier
    smoothing 0.05

    # seconds over which the frame rate and the worst frame are measured
    window 1.0

    # the look sensitivity slider, degrees per pixel
    sensitivity_range 0.01 0.5
}

# pool capacities, and scope arenas in MiB
assets {
    max_models 64
    max_meshes 256
    max_materials 256
    max_skeletons 32
    max_clips 128
    persistent 128
    transient 128
}

